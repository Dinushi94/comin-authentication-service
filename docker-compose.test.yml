version: '3.8'

services:
  postgres_test:
    image: postgres:latest
    environment:
      POSTGRES_USER: comin_owner
      POSTGRES_PASSWORD: password
      POSTGRES_DB: comin_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comin_owner -d comin_test"]
      interval: 5s
      timeout: 5s
      retries: 5